name: 'CloneProof Check'
description: 'Evidence-based setup verification for Node.js and TypeScript repositories.'
author: 'CloneProof Contributors'
inputs:
  mode:
    description: 'Execution mode: check or verify.'
    required: false
    default: 'check'
  target-path:
    description: 'Path to the repository directory to inspect.'
    required: false
    default: '.'
  report-path:
    description: 'Destination path for the generated JSON report.'
    required: false
  allow-network:
    description: 'Allow network access from the Docker verification container.'
    required: false
    default: 'false'
  require-tests:
    description: 'Treat a repository without tests as failed instead of reporting a NO_TESTS_FOUND warning.'
    required: false
    default: 'false'
  timeout-ms:
    description: 'Maximum Docker verification execution time in milliseconds.'
    required: false
    default: '300000'
  receipt-path:
    description: 'Destination path for the reproducibility receipt JSON. Must resolve inside GITHUB_WORKSPACE or RUNNER_TEMP and differ from report-path. Defaults to RUNNER_TEMP/cloneproof/receipt.json.'
    required: false
outputs:
  status:
    description: 'The overall verification status (passed, passed_with_warnings, failed, blocked, or incomplete).'
  report-path:
    description: 'The path to the generated JSON report file.'
  verification-status:
    description: 'Docker verification outcome (not_run, passed, failed, blocked, or error).'
  receipt-path:
    description: 'Path to the generated reproducibility receipt, or an empty string when receipt-status is not created.'
  receipt-status:
    description: 'Receipt generation outcome: created or failed.'
runs:
  using: 'node24'
  main: 'src/action/index.js'
branding:
  icon: 'shield'
  color: 'green'
