name: Wrong or noisy finding
description: CloneProof reported something that isn't true, or isn't a real setup problem.
title: "[false positive] "
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports like this directly improve precision. A public repository URL is the most useful thing you can give us.
  - type: input
    id: code
    attributes:
      label: Finding code
      placeholder: ENV_EXAMPLE_MISSING
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Repository and commit
      description: A public GitHub URL and commit SHA, or describe the repository layout if it is private.
      placeholder: https://github.com/owner/repo @ 0123abc
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: The finding as reported
      description: Paste the finding from the JSON or text report, including its evidence.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: For example, the key is documented in a committed .env file, or the test command never starts a browser.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CloneProof version
      description: Output of `cloneproof --version`, or the Action ref you used.
      placeholder: 0.2.3
    validations:
      required: true
